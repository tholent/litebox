name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Run the tests in headless Chrome
        env:
          LITEBOX_CHROME_ARGS: --no-sandbox --disable-dev-shm-usage
        run: python tests/run.py
      - name: Keep the test drive when something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-output
          path: tests/out/
          retention-days: 7
