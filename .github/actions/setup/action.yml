name: Set up litebox's dev tools
description: >-
  Shared by the workflows. Python with its pip cache and requirements-dev.txt (Pillow, ruff); with node "true",
  also Node.js with its npm cache and the ESLint packages.
inputs:
  node:
    description: Also set up Node.js and install the ESLint packages.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: requirements-dev.txt
    - name: Install the Python tools
      shell: bash
      run: python -m pip install -r requirements-dev.txt
    - if: inputs.node == 'true'
      uses: actions/setup-node@v7
      with:
        node-version: "24"
        cache: npm
        cache-dependency-path: package.json
    - if: inputs.node == 'true'
      name: Install the ESLint packages
      shell: bash
      run: npm install --no-audit --no-fund
